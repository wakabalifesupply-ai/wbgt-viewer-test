<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WBGT Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 0;
    background: #f2f4f7;
    color: #1a1a1a;
  }
  header {
    background: #1e3a5f;
    color: #fff;
    padding: 14px 16px 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .updated { font-size: 11px; color: #b9c9dd; margin-top: 2px; }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
  }
  .toolbar button {
    flex: 1;
    padding: 12px 4px;
    font-size: 14px;
    border-radius: 8px;
    border: none;
    color: #fff;
  }
  #btnRefresh { background: #2563eb; }
  #btnExport { background: #059669; }
  .toolbar button:active { opacity: 0.85; }

  #statusBox {
    margin: 0 16px 10px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .status-ok  { background: #ecfdf5; color: #065f46; }
  .status-ng  { background: #fef2f2; color: #991b1b; }
  .status-wait{ background: #f3f4f6; color: #666; }

  .table-wrap {
    overflow-x: auto;
    margin: 0 16px 16px;
    background: #fff;
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    white-space: nowrap;
  }
  th, td {
    border: 1px solid #e2e6ea;
    padding: 8px 10px;
    text-align: center;
    font-size: 14px;
  }
  thead th {
    background: #eef2f7;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  th.time-col, td.time-col {
    position: sticky;
    left: 0;
    background: #dbe4ee;
    z-index: 1;
    font-weight: bold;
    min-width: 54px;
  }
  th.time-col2, td.time-col2 {
    position: sticky;
    left: 54px;
    background: #eef2f7;
    z-index: 1;
    font-weight: bold;
    min-width: 48px;
  }
  thead th.time-col, thead th.time-col2 { z-index: 3; }
  .val-missing { color: #b91c1c; font-size: 12px; }
  .val-error { color: #b91c1c; }

  #appToast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a; color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  #appToast.show { opacity: 0.95; }
</style>
</head>
<body>

<header>
  <h1>WBGT Viewer</h1>
  <div class="updated" id="headerSub">全11地点 一覧</div>
</header>

<div class="toolbar">
  <button id="btnRefresh">更新</button>
  <button id="btnExport">エクセル出力</button>
</div>

<div id="statusBox" class="status-wait">読み込み中...</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr id="headerRow"><th class="time-col">時刻</th></tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<div id="appToast"></div>

<script>
// =========================================================
// 対象11地点（情報提供地点マスタで確認済みの地点番号）
// =========================================================
const STATIONS = [
  { name: '群馬（前橋）', no: 42251 },
  { name: '宇都宮',       no: 41277 },
  { name: '水戸',         no: 40201 },
  { name: '銚子',         no: 45148 },
  { name: 'さいたま',     no: 43241 },
  { name: '東京',         no: 44132 },
  { name: '横浜',         no: 46106 },
  { name: '新潟（関山）', no: 54816 },
  { name: '長野',         no: 48156 },
  { name: '静岡（御殿場）', no: 50136 },
  { name: '山梨（山中）', no: 49256 },
];

const TOMORROW_HOURS = [6, 9, 12, 15, 18, 21, 24];        // 翌日7コマ
const DAYAFTER_HOURS = [3, 6, 9, 12, 15, 18, 21, 24];     // 翌々日8コマ

let latestResults = null; // { stationNo: { latestRef, byTime } | null(失敗) }
let latestSlots = null;

// ---- ユーティリティ ----
function pad(n) { return String(n).padStart(2, '0'); }
function formatDate14(d) {
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function formatDateSlash(d) {
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:00:00`;
}

// 実行時点(端末のローカル時刻=JST前提)を基準に「翌日」「翌々日」の対象時刻キーを算出
function getTargetSlots() {
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const dayAfter  = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2);

  const slots = { tomorrow: {}, dayAfter: {} };

  TOMORROW_HOURS.forEach(h => {
    const d = new Date(tomorrow);
    d.setHours(h === 24 ? 0 : h, 0, 0, 0);
    if (h === 24) d.setDate(d.getDate() + 1); // 24時 = 翌々日0時として扱う
    slots.tomorrow[h] = formatDateSlash(d);
  });
  DAYAFTER_HOURS.forEach(h => {
    const d = new Date(dayAfter);
    d.setHours(h === 24 ? 0 : h, 0, 0, 0);
    if (h === 24) d.setDate(d.getDate() + 1);
    slots.dayAfter[h] = formatDateSlash(d);
  });
  return slots;
}

// ---- API呼び出し ----
async function fetchStationData(station) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  const from = formatDate14(todayStart);
  const to = formatDate14(now);
  const url = `https://www.wbgt.env.go.jp/api/v1/getForecastData?wbgt_nos=${station.no}&location_type=1&date_search_type=1&range_date_from=${from}&range_date_to=${to}`;

  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json || json.status !== 'success' || !Array.isArray(json.data) || json.data.length === 0) {
    throw new Error('データ0件');
  }
  const latestRef = json.data.reduce((max, d) => d.reference_time > max ? d.reference_time : max, json.data[0].reference_time);
  const latestOnly = json.data.filter(d => d.reference_time === latestRef);
  const byTime = {};
  latestOnly.forEach(d => { byTime[d.forecast_time] = d.forecast_val; });
  return { latestRef, byTime };
}

// ---- 画面描画 ----
function renderHeader() {
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = '<th class="time-col">区分</th><th class="time-col2">時刻</th>';
  STATIONS.forEach(station => {
    const th = document.createElement('th');
    th.textContent = station.name;
    headerRow.appendChild(th);
  });
}

function cellValue(result, key) {
  if (!result) return '<span class="val-error">—</span>';
  const val = key ? result.byTime[key] : undefined;
  if (!key) return '';
  return val !== undefined ? Math.round(parseFloat(val) / 10) : '<span class="val-missing">なし</span>';
}

function renderTable() {
  const tbody = document.getElementById('dataBody');
  tbody.innerHTML = '';

  // --- 翌日ブロック（A列に「翌日」をrowspanでまとめて表示） ---
  TOMORROW_HOURS.forEach((h, idx) => {
    const tr = document.createElement('tr');
    let html = '';
    if (idx === 0) {
      html += `<td class="time-col" rowspan="${TOMORROW_HOURS.length}">翌日</td>`;
    }
    html += `<td class="time-col2">${h}</td>`;
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.tomorrow[h];
      html += `<td>${cellValue(result, key)}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });

  // --- 翌々日ブロック（A列に「翌々日」をrowspanでまとめて表示） ---
  DAYAFTER_HOURS.forEach((h, idx) => {
    const tr = document.createElement('tr');
    let html = '';
    if (idx === 0) {
      html += `<td class="time-col" rowspan="${DAYAFTER_HOURS.length}">翌々日</td>`;
    }
    html += `<td class="time-col2">${h}</td>`;
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.dayAfter[h];
      html += `<td>${cellValue(result, key)}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

async function loadAndRenderAll() {
  const statusBox = document.getElementById('statusBox');
  statusBox.className = 'status-wait';
  statusBox.textContent = '読み込み中... (0/' + STATIONS.length + ')';

  latestSlots = getTargetSlots();
  latestResults = {};

  let successCount = 0;
  let errorStations = [];

  for (let i = 0; i < STATIONS.length; i++) {
    const station = STATIONS[i];
    try {
      latestResults[station.no] = await fetchStationData(station);
      successCount++;
    } catch (err) {
      latestResults[station.no] = null;
      errorStations.push(station.name);
    }
    statusBox.textContent = `読み込み中... (${i + 1}/${STATIONS.length})`;
    renderTable(); // 逐次描画（体感速度向上）
  }

  if (errorStations.length === 0) {
    statusBox.className = 'status-ok';
    statusBox.textContent = `取得完了（全${STATIONS.length}地点）`;
  } else {
    statusBox.className = 'status-ng';
    statusBox.textContent = `一部取得失敗: ${errorStations.join('、')}`;
  }
}

function showToast(msg) {
  const toast = document.getElementById('appToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

function exportExcel() {
  if (!latestResults || !latestSlots) {
    showToast('出力できるデータがありません');
    return;
  }

  const rows = [];
  rows.push(['区分', '時刻', ...STATIONS.map(s => s.name)]);

  TOMORROW_HOURS.forEach(h => {
    const row = ['翌日', h];
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.tomorrow[h];
      const val = result && key ? result.byTime[key] : undefined;
      row.push(val !== undefined ? Math.round(parseFloat(val) / 10) : '');
    });
    rows.push(row);
  });

  DAYAFTER_HOURS.forEach(h => {
    const row = ['翌々日', h];
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.dayAfter[h];
      const val = result && key ? result.byTime[key] : undefined;
      row.push(val !== undefined ? Math.round(parseFloat(val) / 10) : '');
    });
    rows.push(row);
  });

  try {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'WBGT');

    const now = new Date();
    const fname = `wbgt_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('エクセルファイルを出力しました');
  } catch (err) {
    showToast('エクセル出力に失敗しました');
  }
}

// ---- イベント登録 ----
document.getElementById('btnRefresh').addEventListener('click', () => {
  loadAndRenderAll();
});
document.getElementById('btnExport').addEventListener('click', () => {
  exportExcel();
});

// ---- 初期化 ----
renderHeader();
loadAndRenderAll();
</script>

</body>
</html>

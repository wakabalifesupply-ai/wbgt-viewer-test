<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PptxGenJS 検証</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0; padding: 16px;
    background: #f5f5f5; color: #222; line-height: 1.6;
  }
  h1 { font-size: 17px; margin-bottom: 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  button {
    background: #2563eb; color: #fff; border: none; border-radius: 8px;
    padding: 14px 20px; font-size: 15px; width: 100%; margin-bottom: 16px;
  }
  .result {
    padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
    white-space: pre-wrap; word-break: break-all;
  }
  .ok   { background: #dcfce7; border: 1px solid #22c55e; }
  .ng   { background: #fee2e2; border: 1px solid #ef4444; }
  .wait { background: #f3f4f6; border: 1px solid #d1d5db; color: #888; }
  .step { font-size: 13px; color: #444; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>PptxGenJS 直接.pptx生成 検証</h1>
<div class="sub">色付きの表を含む本物の.pptxファイルを生成し、ダウンロードします。</div>

<button id="btnGenerate">.pptxファイルを生成</button>
<div id="result" class="result wait">未実行</div>

<div class="step">
  【確認手順】<br>
  1. 上のボタンで.pptxファイルをダウンロード<br>
  2. ダウンロードしたファイルをPowerPointアプリで開く<br>
  3. エラーなく開けるか（「修復が必要」等のメッセージが出ないか）<br>
  4. 表の背景色（赤・オレンジ・黄・緑・青）が正しく表示されているか確認
</div>

<script>
// 色分けルール（依頼書の基準に準拠）
function colorFor(val) {
  if (val >= 31) return { bg: 'DC2626', fg: 'FFFFFF' }; // 赤
  if (val >= 28) return { bg: 'F97316', fg: 'FFFFFF' }; // オレンジ
  if (val >= 25) return { bg: 'FDE047', fg: '1A1A1A' }; // 黄
  if (val >= 21) return { bg: '22C55E', fg: 'FFFFFF' }; // 緑
  return { bg: '3B82F6', fg: 'FFFFFF' };                 // 青（20以下）
}

const SAMPLE_LABELS = ['地点A', '地点B', '地点C', '地点D', '地点E'];
const SAMPLE = [
  { time: 9,  vals: [18, 22, 26, 29, 32] },
  { time: 12, vals: [19, 23, 27, 30, 33] },
];

document.getElementById('btnGenerate').addEventListener('click', () => {
  const resultEl = document.getElementById('result');
  resultEl.className = 'result wait';
  resultEl.textContent = '生成中...';

  try {
    if (typeof PptxGenJS === 'undefined') {
      throw new Error('PptxGenJSライブラリの読み込みに失敗しました（CDN読み込み失敗の可能性）');
    }

    const pptx = new PptxGenJS();
    const slide = pptx.addSlide();

    const headerRow = [
      { text: '時刻', options: { bold: true, fill: { color: 'EEEEEE' }, align: 'center' } },
      ...SAMPLE_LABELS.map(name => ({
        text: name,
        options: { bold: true, fill: { color: 'EEEEEE' }, align: 'center' }
      }))
    ];

    const dataRows = SAMPLE.map(row => {
      const cells = [{ text: String(row.time), options: { align: 'center' } }];
      row.vals.forEach(v => {
        const c = colorFor(v);
        cells.push({
          text: String(v),
          options: { align: 'center', fill: { color: c.bg }, color: c.fg }
        });
      });
      return cells;
    });

    const rows = [headerRow, ...dataRows];

    slide.addTable(rows, {
      x: 0.5, y: 0.5, w: 8, h: 2,
      fontSize: 14,
      border: { type: 'solid', color: '999999', pt: 1 },
    });

    pptx.writeFile({ fileName: 'wbgt_pptxgenjs_test.pptx' })
      .then(() => {
        resultEl.className = 'result ok';
        resultEl.textContent = '成功\n.pptxファイルを生成・ダウンロードしました。\nPowerPointで開いて、色が反映されているか確認してください。';
      })
      .catch(err => {
        resultEl.className = 'result ng';
        resultEl.textContent = `失敗（writeFile）\n${err.name}: ${err.message}`;
      });

  } catch (err) {
    resultEl.className = 'result ng';
    resultEl.textContent = `失敗\n${err.name}: ${err.message}`;
  }
});
</script>

</body>
</html>

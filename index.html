<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WBGT Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 0;
    background: #f2f4f7;
    color: #1a1a1a;
  }
  header {
    background: #1e3a5f;
    color: #fff;
    padding: 14px 16px 12px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .updated { font-size: 11px; color: #b9c9dd; margin-top: 2px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
  }
  .toolbar button {
    flex: 1 1 30%;
    min-width: 100px;
    padding: 12px 4px;
    font-size: 13px;
    border-radius: 8px;
    border: none;
    color: #fff;
  }
  #btnRefresh { background: #2563eb; }
  #btnExport { background: #059669; }
  #btnPptx { background: #d24726; }
  .toolbar button:active { opacity: 0.85; }

  #statusBox {
    margin: 0 16px 10px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .status-ok  { background: #ecfdf5; color: #065f46; }
  .status-ng  { background: #fef2f2; color: #991b1b; }
  .status-wait{ background: #f3f4f6; color: #666; }

  .table-wrap {
    overflow-x: auto;
    margin: 0 16px 16px;
    background: #fff;
    border-radius: 8px;
    -webkit-overflow-scrolling: touch;
  }
  table {
    border-collapse: collapse;
    white-space: nowrap;
  }
  th, td {
    border: 1px solid #e2e6ea;
    padding: 8px 10px;
    text-align: center;
    font-size: 14px;
  }
  thead th {
    background: #eef2f7;
    font-size: 13px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  th.time-col, td.time-col {
    position: sticky;
    left: 0;
    background: #dbe4ee;
    z-index: 1;
    font-weight: bold;
    min-width: 54px;
  }
  th.time-col2, td.time-col2 {
    position: sticky;
    left: 54px;
    background: #eef2f7;
    z-index: 1;
    font-weight: bold;
    min-width: 48px;
  }
  thead th.time-col, thead th.time-col2 { z-index: 3; }
  .val-missing { color: #b91c1c; font-size: 12px; }
  .val-error { color: #b91c1c; }

  #appToast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a; color: #fff;
    padding: 10px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  #appToast.show { opacity: 0.95; }
</style>
</head>
<body>

<header>
  <h1>WBGT Viewer</h1>
  <div class="updated" id="headerSub">全11地点 一覧</div>
</header>

<div class="toolbar">
  <button id="btnRefresh">更新</button>
  <button id="btnExport">エクセル出力</button>
  <button id="btnPptx">PowerPoint出力</button>
</div>

<div id="statusBox" class="status-wait">読み込み中...</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr id="headerRow"><th class="time-col">時刻</th></tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<div id="appToast"></div>

<script>
// =========================================================
// 対象11地点（情報提供地点マスタで確認済みの地点番号）
// =========================================================
const STATIONS = [
  { name: '群馬（前橋）', no: 42251 },
  { name: '宇都宮',       no: 41277 },
  { name: '水戸',         no: 40201 },
  { name: '銚子',         no: 45148 },
  { name: 'さいたま',     no: 43241 },
  { name: '東京',         no: 44132 },
  { name: '横浜',         no: 46106 },
  { name: '新潟（関山）', no: 54816 },
  { name: '長野',         no: 48156 },
  { name: '静岡（御殿場）', no: 50136 },
  { name: '山梨（山中）', no: 49256 },
];

const TOMORROW_HOURS = [6, 9, 12, 15, 18, 21, 24];        // 翌日7コマ
const DAYAFTER_HOURS = [3, 6, 9, 12, 15, 18, 21, 24];     // 翌々日8コマ

let latestResults = null; // { stationNo: { latestRef, byTime } | null(失敗) }
let latestSlots = null;

// PowerPoint出力用の色分けルール（Ver1.1依頼書の基準に準拠）
// 31以上:赤、28-30:オレンジ、25-27:黄、21-24:緑、20以下:青
function colorFor(val) {
  if (val >= 31) return { bg: 'DC2626', fg: 'FFFFFF' };
  if (val >= 28) return { bg: 'F97316', fg: 'FFFFFF' };
  if (val >= 25) return { bg: 'FDE047', fg: '1A1A1A' };
  if (val >= 21) return { bg: '22C55E', fg: 'FFFFFF' };
  return { bg: '3B82F6', fg: 'FFFFFF' };
}

// ---- ユーティリティ ----
function pad(n) { return String(n).padStart(2, '0'); }
function formatDate14(d) {
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}
function formatDateSlash(d) {
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:00:00`;
}

// 実行時点(端末のローカル時刻=JST前提)を基準に「翌日」「翌々日」の対象時刻キーを算出
function getTargetSlots() {
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const dayAfter  = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 2);

  const slots = { tomorrow: {}, dayAfter: {} };

  TOMORROW_HOURS.forEach(h => {
    const d = new Date(tomorrow);
    d.setHours(h === 24 ? 0 : h, 0, 0, 0);
    if (h === 24) d.setDate(d.getDate() + 1); // 24時 = 翌々日0時として扱う
    slots.tomorrow[h] = formatDateSlash(d);
  });
  DAYAFTER_HOURS.forEach(h => {
    const d = new Date(dayAfter);
    d.setHours(h === 24 ? 0 : h, 0, 0, 0);
    if (h === 24) d.setDate(d.getDate() + 1);
    slots.dayAfter[h] = formatDateSlash(d);
  });
  return slots;
}

// ---- API呼び出し ----
async function fetchStationData(station) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
  const from = formatDate14(todayStart);
  const to = formatDate14(now);
  const url = `https://www.wbgt.env.go.jp/api/v1/getForecastData?wbgt_nos=${station.no}&location_type=1&date_search_type=1&range_date_from=${from}&range_date_to=${to}`;

  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json || json.status !== 'success' || !Array.isArray(json.data) || json.data.length === 0) {
    throw new Error('データ0件');
  }
  const latestRef = json.data.reduce((max, d) => d.reference_time > max ? d.reference_time : max, json.data[0].reference_time);
  const latestOnly = json.data.filter(d => d.reference_time === latestRef);
  const byTime = {};
  latestOnly.forEach(d => { byTime[d.forecast_time] = d.forecast_val; });
  return { latestRef, byTime };
}

// ---- 画面描画 ----
function renderHeader() {
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = '<th class="time-col">区分</th><th class="time-col2">時刻</th>';
  STATIONS.forEach(station => {
    const th = document.createElement('th');
    th.textContent = station.name;
    headerRow.appendChild(th);
  });
}

function cellValue(result, key) {
  if (!result) return '<span class="val-error">—</span>';
  const val = key ? result.byTime[key] : undefined;
  if (!key) return '';
  return val !== undefined ? Math.round(parseFloat(val) / 10) : '<span class="val-missing">なし</span>';
}

function renderTable() {
  const tbody = document.getElementById('dataBody');
  tbody.innerHTML = '';

  // --- 翌日ブロック（A列に「翌日」をrowspanでまとめて表示） ---
  TOMORROW_HOURS.forEach((h, idx) => {
    const tr = document.createElement('tr');
    let html = '';
    if (idx === 0) {
      html += `<td class="time-col" rowspan="${TOMORROW_HOURS.length}">翌日</td>`;
    }
    html += `<td class="time-col2">${h}</td>`;
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.tomorrow[h];
      html += `<td>${cellValue(result, key)}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });

  // --- 翌々日ブロック（A列に「翌々日」をrowspanでまとめて表示） ---
  DAYAFTER_HOURS.forEach((h, idx) => {
    const tr = document.createElement('tr');
    let html = '';
    if (idx === 0) {
      html += `<td class="time-col" rowspan="${DAYAFTER_HOURS.length}">翌々日</td>`;
    }
    html += `<td class="time-col2">${h}</td>`;
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.dayAfter[h];
      html += `<td>${cellValue(result, key)}</td>`;
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

async function loadAndRenderAll() {
  const statusBox = document.getElementById('statusBox');
  statusBox.className = 'status-wait';
  statusBox.textContent = '読み込み中... (0/' + STATIONS.length + ')';

  latestSlots = getTargetSlots();
  latestResults = {};

  let successCount = 0;
  let errorStations = [];

  for (let i = 0; i < STATIONS.length; i++) {
    const station = STATIONS[i];
    try {
      latestResults[station.no] = await fetchStationData(station);
      successCount++;
    } catch (err) {
      latestResults[station.no] = null;
      errorStations.push(station.name);
    }
    statusBox.textContent = `読み込み中... (${i + 1}/${STATIONS.length})`;
    renderTable(); // 逐次描画（体感速度向上）
  }

  if (errorStations.length === 0) {
    statusBox.className = 'status-ok';
    statusBox.textContent = `取得完了（全${STATIONS.length}地点）`;
  } else {
    statusBox.className = 'status-ng';
    statusBox.textContent = `一部取得失敗: ${errorStations.join('、')}`;
  }
}

function showToast(msg) {
  const toast = document.getElementById('appToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

function exportExcel() {
  if (!latestResults || !latestSlots) {
    showToast('出力できるデータがありません');
    return;
  }

  const rows = [];
  rows.push(['区分', '時刻', ...STATIONS.map(s => s.name)]);

  // 翌日ブロック：1行目だけ「翌日」、以降は空文字（あとでセル結合する）
  TOMORROW_HOURS.forEach((h, idx) => {
    const row = [idx === 0 ? '翌日' : '', h];
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.tomorrow[h];
      const val = result && key ? result.byTime[key] : undefined;
      row.push(val !== undefined ? Math.round(parseFloat(val) / 10) : '');
    });
    rows.push(row);
  });

  // 翌々日ブロック：1行目だけ「翌々日」、以降は空文字
  DAYAFTER_HOURS.forEach((h, idx) => {
    const row = [idx === 0 ? '翌々日' : '', h];
    STATIONS.forEach(station => {
      const result = latestResults[station.no];
      const key = latestSlots.dayAfter[h];
      const val = result && key ? result.byTime[key] : undefined;
      row.push(val !== undefined ? Math.round(parseFloat(val) / 10) : '');
    });
    rows.push(row);
  });

  try {
    const ws = XLSX.utils.aoa_to_sheet(rows);

    // A列のセル結合：ヘッダー行の次(1行目)から翌日ブロック分、その後に翌々日ブロック分
    const tomorrowStartRow = 1; // 0始まり。0行目はヘッダー
    const tomorrowEndRow = tomorrowStartRow + TOMORROW_HOURS.length - 1;
    const dayAfterStartRow = tomorrowEndRow + 1;
    const dayAfterEndRow = dayAfterStartRow + DAYAFTER_HOURS.length - 1;

    ws['!merges'] = [
      { s: { r: tomorrowStartRow, c: 0 }, e: { r: tomorrowEndRow, c: 0 } },
      { s: { r: dayAfterStartRow, c: 0 }, e: { r: dayAfterEndRow, c: 0 } },
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'WBGT');

    const now = new Date();
    const fname = `wbgt_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('エクセルファイルを出力しました');
  } catch (err) {
    showToast('エクセル出力に失敗しました');
  }
}

// ---- PowerPoint出力（依頼書サンプル準拠：日ごと2枚、地点×時刻、凡例、評価コメント） ----

// 5段階の色分け・呼称（依頼書サンプルの凡例に準拠）
const LEGEND_LEVELS = [
  { label: 'ほぼ安全', bg: '3B82F6', fg: 'FFFFFF', test: v => v < 21 },
  { label: '注　　意', bg: '22C55E', fg: 'FFFFFF', test: v => v >= 21 && v <= 24 },
  { label: '警　　戒', bg: 'FDE047', fg: '1A1A1A', test: v => v >= 25 && v <= 27 },
  { label: '厳重警戒', bg: 'F97316', fg: 'FFFFFF', test: v => v >= 28 && v <= 30 },
  { label: '活動中止', bg: 'DC2626', fg: 'FFFFFF', test: v => v >= 31 },
];

// 指定した時刻群における「地点ごとの最大値」と、それに基づく評価コメント情報を算出
function evaluateDay(hours, slotMap) {
  const stationMax = {}; // stationName -> 最大値
  STATIONS.forEach(station => {
    const result = latestResults[station.no];
    let max = null;
    hours.forEach(h => {
      const key = slotMap[h];
      const val = result && key ? result.byTime[key] : undefined;
      if (val !== undefined) {
        const num = Math.round(parseFloat(val) / 10);
        if (max === null || num > max) max = num;
      }
    });
    if (max !== null) stationMax[station.name] = max;
  });

  const over31 = Object.entries(stationMax).filter(([, v]) => v >= 31).map(([name]) => name);
  const over28 = Object.entries(stationMax).filter(([, v]) => v >= 28 && v <= 30).map(([name]) => name);

  // 31以上の地点が1つでもあれば、31以上のフォーマットのみ使用する
  if (over31.length > 0) {
    return {
      tier: 31,
      names: over31,
      text: `東方区内においては、熱中症発生のリスクは大\n　→　${over31.join('、')}は日中に活動中止（３１以上）となることから、特別な場合を除き屋外での活動は中止又は活動時間と休息時間を適切に管理する等の予防が必要`,
    };
  }
  if (over28.length > 0) {
    return {
      tier: 28,
      names: over28,
      text: `東方区内の一部においては、熱中症発生のリスクが大\n　→　${over28.join('、')}は日中に２８以上（厳重警戒）となるため、屋外での活動を行わなければならない部隊等においては、十分な熱中症予防及び必要により計画の修正等の実施が望ましい。`,
    };
  }
  return null; // 該当なし（コメントなし）
}

function addReportSlide(pptx, title, hours, slotMap) {
  const slide = pptx.addSlide();

  slide.addText(title, {
    x: 0.3, y: 0.15, w: 9, h: 0.5,
    fontSize: 20, bold: true, color: '1E3A5F',
  });

  // ---- メイン表：地点(縦) × 時刻(横) ----
  const headerCellOpt = { bold: true, fill: { color: 'EEEEEE' }, align: 'center', fontSize: 11 };
  const headerRow = [
    { text: '地点＼時刻', options: headerCellOpt },
    ...hours.map(h => ({ text: String(h), options: headerCellOpt })),
  ];

  const dataRows = STATIONS.map(station => {
    const result = latestResults[station.no];
    const cells = [{ text: station.name, options: { bold: true, align: 'center', fontSize: 10, fill: { color: 'F5F5F5' } } }];
    hours.forEach(h => {
      const key = slotMap[h];
      const val = result && key ? result.byTime[key] : undefined;
      if (val === undefined) {
        cells.push({ text: '—', options: { align: 'center', fontSize: 10 } });
      } else {
        const num = Math.round(parseFloat(val) / 10);
        const c = colorFor(num);
        cells.push({ text: String(num), options: { align: 'center', fontSize: 10, fill: { color: c.bg }, color: c.fg } });
      }
    });
    return cells;
  });

  slide.addTable([headerRow, ...dataRows], {
    x: 0.3, y: 0.75, w: 9.7, h: 4.6,
    border: { type: 'solid', color: '999999', pt: 1 },
    autoPage: false,
  });

  // ---- 凡例（5段階） ----
  const legendRow = LEGEND_LEVELS.map(lv => ({
    text: lv.label,
    options: { align: 'center', fontSize: 10, fill: { color: lv.bg }, color: lv.fg, bold: true },
  }));
  slide.addTable([legendRow], {
    x: 0.3, y: 5.5, w: 9.7, h: 0.4,
    border: { type: 'solid', color: '999999', pt: 1 },
  });

  // ---- 評価コメント（該当時のみ） ----
  const evalInfo = evaluateDay(hours, slotMap);
  if (evalInfo) {
    slide.addText([
      { text: '評　価\n', options: { bold: true, fontSize: 12, color: '991B1B' } },
      { text: evalInfo.text, options: { fontSize: 12, color: '1A1A1A' } },
    ], {
      x: 0.3, y: 6.05, w: 9.7, h: 1.2,
      fill: { color: 'FFFFCC' },
      valign: 'top',
      margin: 8,
    });
  }
}

function exportPowerPoint() {
  if (!latestResults || !latestSlots) {
    showToast('出力できるデータがありません');
    return;
  }
  if (typeof PptxGenJS === 'undefined') {
    showToast('PowerPoint出力ライブラリの読み込みに失敗しました');
    return;
  }

  try {
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'WBGT_LAYOUT', width: 10.2, height: 7.5 });
    pptx.layout = 'WBGT_LAYOUT';

    addReportSlide(pptx, '翌日のWBGT指数予測値', TOMORROW_HOURS, latestSlots.tomorrow);
    addReportSlide(pptx, '翌々日のWBGT指数予測値', DAYAFTER_HOURS, latestSlots.dayAfter);

    const now = new Date();
    const fname = `wbgt_pptx_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.pptx`;

    pptx.writeFile({ fileName: fname })
      .then(() => showToast('PowerPointファイルを出力しました'))
      .catch(() => showToast('PowerPoint出力に失敗しました'));

  } catch (err) {
    showToast('PowerPoint出力に失敗しました');
  }
}


// ---- イベント登録 ----
document.getElementById('btnRefresh').addEventListener('click', () => {
  loadAndRenderAll();
});
document.getElementById('btnExport').addEventListener('click', () => {
  exportExcel();
});
document.getElementById('btnPptx').addEventListener('click', () => {
  exportPowerPoint();
});

// ---- 初期化 ----
renderHeader();
loadAndRenderAll();
</script>

</body>
</html>
